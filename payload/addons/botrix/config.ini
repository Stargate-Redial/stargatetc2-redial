;*******************************************************************************
; Botrix configuration for StargateTC 2 (stargatetc2, Source SDK Base 2006).
; Weapons are the class packs (fixed per class, chosen with set_<class>).
; Damage from the mod's scripts/weapon_*.txt; fire rates are estimates.
;
; Warning: when '\' continues a line, nothing may follow it on that line.
;*******************************************************************************

[General]
console_log_level = info
file_log = botrix.log
file_log_level = info
name_with_intelligence = off
names = O'Neill, Carter, Jackson, Teal'c, Hammond, Makepeace, Ferretti,\
        Kawalsky, Reynolds, Dixon, Mitchell, Vala, Bra'tac, Rya'c,\
        Apophis, Heru'ur, Sokar, Cronus, Nirrti, Yu, Ba'al, Anubis, Herak

[User access]
STEAM_ID_LAN = waypoint bot config

;-------------------------------------------------------------------------------
; games: folder of the hl2/srcds executable (game: Source SDK Base; the local
; test dedicated server: srcds2006b). Teams by number: 2 Goa'uld, 3 Tau'ri.
;-------------------------------------------------------------------------------
[StargateTC2.mod]
games = Source SDK Base, srcds2006b, srcds2006, Source Dedicated Server
mods = stargatetc2
bot = sgtc2
teams = unassigned, spectators, goauld, tauri

[StargateTC2.vars]
max_health = 100
max_armor = 100
player_width = 32
player_height = 72
player_height_crouched = 36
player_eye = 64
player_eye_crouched = 28
velocity_crouch = 63
velocity_walk = 150
velocity_run = 190
velocity_sprint = 320
obstacle_height_no_jump = 18
jump_height = 20
jump_height_crouched = 56
max_height_no_fall_damage = 220
max_slope_gradient = 45

[StargateTC2.items.spawn]
info_player_tauri = none
info_player_goa = none

[StargateTC2.items.door]
prop_door_rotating = use
func_door = none

[StargateTC2.items.ladder]
func_useableladder = none

;-------------------------------------------------------------------------------
; Weapons. Energy weapons (staff, zat, zat'arc) don't use ammo: big clip and
; ammo so that bots never think they ran out. Staff and Zat'arc shots explode:
; 'range 160 ...' keeps smart bots from firing at point blank.
; Names as the game reports the weapon in hand (lowercase): 'weapon_Staff', 'weapon_Zat' and the knives with a
; capital never matched (2026-10-27), and bots used them as unknown weapons (no minimum range, attack held).
;-------------------------------------------------------------------------------
[StargateTC2.weapons]
weapon_knifetau = team tauri, type melee, preference lowest, delay 600, damage 30,\
    holster 400, range 0 70

weapon_knifegoa = team goauld, type melee, preference lowest, delay 600, damage 30,\
    holster 400, range 0 70

weapon_beretta = team tauri, type pistol, preference low, clip 15, damage 24,\
    delay 200, reload 2000?, holster 500, default_ammo 60, max_ammo 75, range 0 1500

weapon_p90 = team tauri, type rifle, preference high, clip 50, damage 14,\
    delay 70, reload 2500?, holster 700, default_ammo 200, max_ammo 250, range 0 2000

weapon_mp5 = team tauri, type rifle, preference high, clip 30, damage 19,\
    delay 85, reload 2500?, holster 700, default_ammo 150, max_ammo 180, range 0 2000

weapon_sniper = team tauri, type rifle, preference high, clip 5, damage 115,\
    delay 1500, reload 3000?, holster 1000, default_ammo 30, max_ammo 35

weapon_zat = type pistol, preference normal, clip 100, damage 40, delay 600,\
    reload 100, holster 500, default_ammo 9999, max_ammo 9999, range 0 1800

; Staff: a shot every second for bots (2026-10-27; 700 before, never applied until the name was fixed). On
; sg2_sanctuary the Goa'uld out-kill the Tau'ri about 3 to 2 whatever the delay tried (700 / 1000 / 1300): which
; classes the bots draw weighs more.
; "type pistol" for the staff and the zat'arc (2026-10-28): with "type rifle" bots hold the trigger for the
; whole delay, and a weapon that fires while held fires at the game's own rate (SGTLS's Kull did, 5.5 shots a
; second). One press per delay at most, whatever the weapon does when held.
weapon_staff = type pistol, preference high, clip 100, damage 40, delay 1000,\
    reload 100, holster 700, default_ammo 9999, max_ammo 9999, range 160 2500

; Zat'arc: one shot kills (100 damage). Bots fire it at most every 2.6 s (the game allows 0.9 s) and within
; 1000 units only (was 0.9 s and 2500): the user found the bots too strong with it (2026-10-27: 1.6 s and 1200;
; then bots keeping their distance with it made 16-23 kills of 37-43 on sg2_sanctuary: 2.6 s and 1000).
weapon_zatarc = team goauld, type pistol, preference highest, clip 5, damage 100,\
    delay 3500, reload 2500?, holster 700, default_ammo 30, max_ammo 35, range 160 800

weapon_grenade_he = team tauri, type grenade, preference lowest, damage 150, clip 1,\
    delay 2000, hold 400, reload 1000, holster 1000, aim foot, default_ammo 1,\
    max_ammo 1

weapon_grenade_shock = team goauld, type grenade, preference lowest, damage 150, clip 1,\
    delay 2000, hold 400, reload 1000, holster 1000, aim foot, default_ammo 1,\
    max_ammo 1

weapon_tac = team goauld, type grenade, preference lowest, damage 150, clip 1,\
    delay 2000, hold 400, reload 1000, holster 1000, aim foot, default_ammo 1,\
    max_ammo 1
